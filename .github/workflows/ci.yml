name: CI

on:
  push:
    branches:
      - main
      - "issue-*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install

      - name: Format, lint, typecheck, unit, architecture and production build
        run: npm run verify

      - name: GitHub Pages subdirectory build
        env:
          VITE_BASE_PATH: /macro-nation/
          VITE_AI_ENABLED: "false"
        run: npm run build:pages

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: PWA and accessibility E2E
        run: npm run test:e2e
