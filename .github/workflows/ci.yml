name: CI

on:
  push:
    branches:
      - main
      - "issue-*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install

      - name: Format, lint, typecheck, unit, architecture and production build
        run: npm run verify

      - name: GitHub Pages subdirectory build
        env:
          VITE_BASE_PATH: /macro-nation/
          VITE_AI_ENABLED: "false"
        run: npm run build:pages

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: PWA and accessibility E2E
        run: npm run test:e2e

      - name: Capture mobile layout before and after
        if: always() && github.event_name == 'pull_request'
        env:
          SCREENSHOT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/capture-viewport-comparison.mjs

      - name: Upload viewport checks and comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-checks
          path: |
            artifacts/issue-89/
            test-results/
            playwright-report/
          if-no-files-found: ignore
